<title>Project Atlas - Earthside</title>
<style>
:root{--bg:#0b0f14;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--tx:#e8edf3;--dim:#8d99a8;--amber:#ffb347;--green:#4ade80;--red:#ff5a4a;--teal:#2dd4bf;--sam:#2dd4bf;--khan:#fb923c;--max:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#05070a;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;overflow:hidden;overscroll-behavior:none}
svg{display:block}
#app{position:relative;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;--uz:1}
#app.wide{flex-direction:row;padding-left:env(safe-area-inset-left)}
#stage{position:relative;flex:1 1 0;min-height:230px;min-width:0;width:100%;background:#0b0f14;overflow:hidden}
#app.wide #stage{height:100%;min-height:0}
#hud .pills,#hud .chips{max-width:620px}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 8px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.pills{display:flex;gap:4px;pointer-events:auto;justify-content:space-between}

function layout(){
  var app=$('#app'),vw=window.innerWidth||390,vh=window.innerHeight||800;app.scrollTop=0;try{window.scrollTo(0,0);}catch(e){}
  /* widescreen: world on the left, controls in a side panel. portrait: world on top */
  var wide=vw/vh>1.15&&vw>=560;app.classList.toggle('wide',wide);
  var uz=clamp(Math.min(vw,vh)/430,1,1.35);app.style.setProperty('--uz',uz);
  $('#dock').style.width=wide?Math.round(Math.min(vw*.44,Math.max(310,335*uz)))+'px':'';
  var st=$('#stage'),sw=st.clientWidth||390,sh=Math.max(120,st.clientHeight||300);
  /* the drawing surface is capped by the graphics level, so big screens do not multiply the work */
  var cap=QPX[QL];dpr=Math.min(2,window.devicePixelRatio||1);if(sw*sh*dpr*dpr>cap)dpr=Math.max(.6,Math.sqrt(cap/(sw*sh)));
  var cw=Math.round(sw*dpr),chh=Math.round(sh*dpr);if(cv.width!==cw||cv.height!==chh){cv.width=cw;cv.height=chh;dk.width=cw;dk.height=chh;}
  if(MODE==='exp'){var tile=clamp(Math.min(sw/8.6,sh/6.4)*ZM.exp,22,160);K=tile/46;W=sw/K;}else{W=520;K=sw/520;}
  LH=sh/K;
  ctx.setTransform(dpr*K,0,0,dpr*K,0,0);dkc.setTransform(dpr*K,0,0,dpr*K,0,0);
}
var layQ=0;function layoutSoon(){if(layQ)return;layQ=requestAnimationFrame(function(){layQ=0;layout();});}
try{new ResizeObserver(layoutSoon).observe($('#stage'));}catch(e){}
window.addEventListener('orientationchange',function(){setTimeout(layout,250);});
function setMode(m){MODE=m;setTimeout(function(){var a2=$('#app');a2.scrollTop=0;},0);var a=$('#app');a.classList.remove('day','exp');a.classList.add(m==='exp'?'exp':'day');layout();}

function startDay(){

  shelterAcc=0;dockAcc=0;

function jobState(id,k){
  var c=S.ch[id];
  if(c.away)return {off:true,why:'away'};
  if(c.out)return {off:true,why:'outside'};
  if(isBot(id)&&c.off)return {off:true,why:'offline'};
  if(CH[id].bot==='combat'&&k!=='rest'&&k!=='guard')return {off:true,why:'combat unit'};
  if(JROOM[k]&&!getRoom(JROOM[k]))return {off:true,why:'build room'};
  if(k==='craft'&&id!=='sam'&&!(id==='bob'&&prog('bob').lv>=5))return {off:true,why:id==='bob'?'needs Mk V':'Sam only'};
  if(k==='scout'){if(isBot(id))return {off:true,why:'auto'};if(id!=='sam'&&id!=='khan')return {off:true,why:'follows'};if(id==='max')return {off:true,why:'follows'};if(c.en<30)return {off:true,why:'too tired'};}
  if(k==='recon'){if(id!=='khan')return {off:true,why:'Khan only'};if(c.en<50)return {off:true,why:'too tired'};}
  if(k==='treat'&&isBot(id))return {off:true,why:'robot'};
  if((k==='proj'||k==='mist')&&id==='max')return {off:true,why:'paws'};
  if(k==='proj'){if(adaOn())return {off:true,why:'Ada is awake'};if(!S.ada.paid)return {off:true,why:'supply materials'};}
  return {off:false};
}
function taskInfo(id){
  var c=(S||PREV).ch[id],t=c.task;if(c.away)return {ic:'eye',txt:'Recon '+Math.max(0,Math.ceil(c.awayT))+'s'};if(c.out)return {ic:'pin',txt:'Outside'};if(c.off)return {ic:'power',txt:'Offline'};
  var k=taskKey(t);
  if(k==='craft'){var r=RECIPES[t.slice(6)];return {ic:'wrench',txt:r?r.name:'Craft'};}
  if(k==='treat')return {ic:'meds',txt:'Treating'};
  if(k==='scout')return {ic:'pin',txt:'Sortie'};
  var j=JOBS.filter(function(j){return j.k===k;})[0];return {ic:j.ic,txt:j.name};
}

     (!bob&&(c.rad>0||c.ar>0)?'<div style="display:flex;gap:6px;font-size:9.5px;font-weight:800">'+(c.ar>0?'<span style="color:#7dd3fc">AR '+c.ar+'</span>':'')+(c.rad>0?'<span style="color:#bef264">RAD '+Math.round(c.rad)+'</span>':'')+'</div>':'')+

      if(j.k==='proj'&&S.ada&&!adaOn())sub='stage '+(S.ada.ep+1)+' of 5';if(j.k==='mist')sub=bayN()+' beds';
      if(act&&j.k==='craft')sub=RECIPES[c2.task.slice(6)].name;if(st.off)sub=st.why;
      th+='<button class="tile'+(act?' act':'')+(st.off?' off':'')+'" data-k="'+j.k+'" style="--c:'+ch2.col+'"><div class="ic">'+svg(st.off&&st.why!=='away'&&st.why!=='offline'?'lock':j.ic,18)+'</div><b>'+j.name+'</b><small>'+sub+'</small></button>';});
  }else{ah='<b>Tap a survivor</b><span>to give them a job</span>';}
  $('#acthead').innerHTML=ah;$('#tiles').innerHTML=th;var gb=$('#gearB');if(gb)gb.addEventListener('click',function(){openInv(1+WEARERS.indexOf(sel));});
  Array.prototype.forEach.call($('#tiles').querySelectorAll('.tile'),function(el){el.addEventListener('click',function(){pickJob(sel,el.dataset.k);});});
  $('#endBtn').innerHTML='SORTIE '+svg('pin',18);

function pickJob(id,k){
  if(!id||!S.ch[id].alive)return;var st=jobState(id,k);
  if(st.off){sfx.ui('err');toast(CH[id].name+': '+st.why,'#ff9d92');return;}
  sfx.ui('tap');
  if(k==='craft')return openCraft(id);
  if(k==='scout')return openPlanner(id);
  if(k==='recon')return openRecon(id);
  if(k==='treat')return openTreat(id);
  S.ch[id].task=k;S.ch[id].prog=0;renderDock();
}
function openCraft(id){
  var h='<div class="sh"><div><h3>Workbench</h3><span>'+CH[id].name+' builds it in real time</span></div><button class="x">'+svg('x',16)+'</button></div>';
  Object.keys(RECIPES).forEach(function(k){var r=RECIPES[k],maxed=recMaxed(r),lk=r.req&&roomLvl(r.req.room)<r.req.lvl,aff=canAfford(r.cost),off=maxed||!aff||lk;
    h+='<button class="row'+(off?' off':'')+'" data-k="'+k+'"><div class="ic" style="color:'+(k==='relaykit'||k==='nodekit'?'#67e8f9':'#ffb347')+'">'+svg(r.ic,22)+'</div><div class="mid"><b>'+r.name+(maxed?' <span class="built">'+(r.bot||r.gear?'MAX':'BUILT')+'</span>':r.gear&&S.up[r.up]?' <span class="built">'+S.up[r.up]+' / '+r.max+'</span>':r.bobup?' <span class="built">Mk '+prog('bob').lv+' of 5</span>':'')+(lk?' <span class="built" style="color:#ffb347">'+r.req.txt+'</span>':'')+'</b><small>'+r.desc+' · '+RT[k]+'s</small>'+(maxed?'':costChips(r.cost))+'</div></button>';});

    for(var ck in r.cost)S.res[ck]-=r.cost[ck];S.ch[id].task='craft:'+k;S.ch[id].prog=0;closeSheet();renderDock();toast(CH[id].name+' starts: '+r.name+' ('+RT[k]+'s)','#ffb347');});});

function taskProg(id){
  var c=S.ch[id];if(c.away)return 1-c.awayT/200;var t=c.task,k=taskKey(t);
  if(JRES[k])return c.prog/JT[k];if(k==='craft')return c.prog/(RT[t.slice(6)]||20);if(k==='proj')return S.ada&&EPICS[S.ada.ep]?S.ada.w/EPICS[S.ada.ep].w:0;if(k==='treat')return c.prog/JT.treat;return 0;
}
function shelterTick(dt){
  S.clock+=dt;
  IDS.forEach(function(id){
    var c=S.ch[id];if(!c.alive)return;
    if(c.away){c.awayT-=dt;if(c.awayT<=0&&id==='khan'){c.awayT=0;c.away=0;reconDue=true;}return;}
    if(c.out)return;if(isBot(id)&&c.off)return;
    var t=c.task,k=taskKey(t),hum=!isBot(id),n=CH[id].name;
    if(k==='rest'){if(!hum&&c.hp<100)c.hp=Math.min(100,c.hp+.25*dt);if(hum){var qm=roomMul('quarters');c.en=Math.min(100,c.en+.5*dt*qm);c.hp=Math.min(100,c.hp+.07*dt*qm);c.rad=Math.max(0,c.rad-.1*dt*qm);}return;}
    var mul=roomMul(JROOM[k])*skill(id,k);
    if(hum)c.en=Math.max(0,c.en-(k==='guard'?.03:.06)*dt);
    if((JRES[k]||k==='guard'||k==='mist'||k==='proj')&&hum&&c.en<=2){c.task='rest';c.prog=0;jobLog(n+' is exhausted and rests.','#ffb347');return;}
    if(JRES[k]){var pc=JCOST[k];
      if(!pc||canAfford(pc)){c.prog+=dt*mul;
        if(c.prog>=JT[k]){c.prog-=JT[k];if(pc)for(var pk in pc)S.res[pk]-=pc[pk];var dbl=perk(id,'eng',6)&&Math.random()<.25?2:1;S.res[JRES[k]]+=dbl;gainXP(id,6,false);jobLog(n+': +'+dbl+' '+RNAME[JRES[k]]);if(!shelterQuiet)sfx.pickup(JRES[k]);}}}
    else if(k==='craft'){var key=t.slice(6),r=RECIPES[key];c.prog+=dt*mul;
      if(!r){c.task='rest';c.prog=0;return;}
      if(c.prog>=(RT[key]||20)*(perk(id,'eng',3)?.8:1)){c.prog=0;gainXP(id,10,false);S.stats.crafted=(S.stats.crafted||0)+1;if(r.bobup&&prog('bob').lv<5){var bb=prog('bob');bb.lv++;RECIPES.bob_up.cost=bobCost();jobLog('Bob upgraded to '+titleOf('bob')+'.','#fde68a');toast('Bob is now '+titleOf('bob')+'.','#fde68a');}if(r.give)give(r.give);if(r.up)S.up[r.up]++;if(r.bot){var nb=addBot(r.bot);jobLog(nb.name+' is online.','#93c5fd');if(!shelterQuiet)renderDock();}
        if(key==='recycle'&&Math.random()<.35){S.res.gold++;jobLog(n+' salvaged a gram of gold.','#fbbf24');}
        jobLog(n+' built: '+r.name+'.','#ffb347');if(!shelterQuiet)sfx.pickup('parts');
        if(r.up||r.bot||r.bobup||!canAfford(r.cost)||recMaxed(r)){c.task='rest';if(!r.up&&!r.bot)jobLog(n+': out of materials, resting.','#ffb347');}
        else for(var ck in r.cost)S.res[ck]-=r.cost[ck];}}
    else if(k==='proj'){if(!S.ada.paid||adaOn()){c.task='rest';c.prog=0;return;}adaWork(id,dt*mul);if(Math.random()<dt/12)gainXP(id,1,false);}
    else if(k==='mist'){if(Math.random()<dt/20&&hum)gainXP(id,1,false);}
    else if(k==='treat'){c.prog+=dt*mul;if(c.prog>=JT.treat){c.prog=0;var mb=roomLvl('medbay')-1;if(t==='treat:rad'){c.rad=Math.max(0,c.rad-40-10*mb);if(!shelterQuiet)sfx.antirad();}else{c.hp=Math.min(100,c.hp+30+10*mb);c.band=Date.now()+90000;if(!shelterQuiet)sfx.heal();}c.task='rest';jobLog(n+' was treated.','#86efac');}}
  });
  newSysTick(dt);
  if(Math.floor(S.clock)%20===0)wxStep(1);
}

  else if(t==='water'){o.push(['Filter speed',m]);o.push(['Rain collectors','+'+(l-1)]);}
  else if(t==='power'){o.push(['Generation',m]);o.push(['Bus',l>=2?'24V + 48V':'24V']);}
  else if(t==='medbay'){o.push(['Treat speed',m]);o.push(['Healing','+'+(30+10*(l-1))+' HP']);}

/* ====================================================================

   - Mushrooms grow on the real clock. Ripe ones wait a while, then spoil.
   - Ada is a tube-logic mind for the shelter, built in five long stages.
   ==================================================================== */
var AWAY_CAP=12,ADA_CAP=24;                       /* hours of away work counted */
var OFFR={tend:3,water:3,gen:2,smelt:2,listen:.5};  /* units per hour per worker */
var PROJ_OFF=.22;                                   /* Ada work points per second while away (online: 1) */

/* ---------- mushrooms ---------- */
var SHROOM={
  oyster:{n:'Oyster',lat:'Pleurotus ostreatus',col:'#d6dbe2',grow:30,fresh:12,cost:{water:1,scrap:1},yl:'+3 food',
    cul:'Shredded and roasted like pulled pork, fried into crispy tenders, tossed into pasta.',med:'Beta-glucans for heart health, cholesterol and everyday immunity.'},
  chestnut:{n:'Chestnut',lat:'Pholiota adiposa',col:'#b8692a',grow:60,fresh:24,cost:{water:1,scrap:1},yl:'+4 food',

  lion:{n:"Lion's Mane",lat:'Hericium erinaceus',col:'#f3ead6',grow:120,fresh:24,cost:{water:2,scrap:1},yl:'+2 food, +20 XP for whoever harvests',
    cul:'Pan-seared as steaks, pulled apart for crab cakes, or sautéed in butter like lobster.',med:'Dried into powder for focus, memory and nerve repair.'},
  reishi:{n:'Reishi',lat:'Ganoderma lucidum',col:'#a3242f',grow:240,fresh:36,cost:{water:2,parts:1},yl:'+1 medicine, +30 energy for everyone at home',
    cul:'Too woody to eat; thin dried slices give broths an earthy depth.',med:'Evening tea or tincture for stress, sleep and immune balance.'},
  turkey:{n:'Turkey Tail',lat:'Trametes versicolor',col:'#9b7a3c',grow:240,fresh:36,cost:{water:2,parts:1},yl:'+2 medicine',
    cul:'Leathery; simmered into stocks for flavour, then strained out.',med:'Decoction or powder for gut health and immune defence.'}
};
var SHK=['oyster','chestnut','lion','reishi','turkey'];
function bayN(){return getRoom('shroom')?2+roomLvl('shroom'):0;}
function growMs(sp){return SHROOM[sp].grow*60000*(1-.18*(Math.max(1,roomLvl('shroom'))-1));}
function slotState(s,now){if(!s)return 'empty';if(now<s.ripe)return 'growing';if(now<s.spoil)return 'ripe';return 'spoiled';}
function fmtLeft(ms){ms=Math.max(0,ms);var m=Math.floor(ms/60000),h=Math.floor(m/60);if(h>=1)return h+'h '+('0'+(m%60)).slice(-2)+'m';if(m>=1)return m+'m';return Math.ceil(ms/1000)+'s';}
function plantSlot(i,sp,t0){var d=SHROOM[sp];if(!canAfford(d.cost))return false;payCost(d.cost);var g=growMs(sp),st=t0||Date.now();S.shroom[i]={sp:sp,t0:st,ripe:st+g,spoil:st+g+d.fresh*3600000};S.stats.planted=(S.stats.planted||0)+1;return true;}
function harvestSlot(i,who){
  var s=S.shroom[i];if(!s)return '';var d=SHROOM[s.sp],out=d.n;S.shroom[i]=null;S.stats.shrooms=(S.stats.shrooms||0)+1;
  if(s.sp==='oyster')S.res.food+=3;else if(s.sp==='chestnut')S.res.food+=4;
  else if(s.sp==='lion'){S.res.food+=2;gainXP(who&&CH[who]&&!isBot(who)?who:'sam',20,false);}
  else if(s.sp==='reishi'){S.res.meds++;present().forEach(function(id){if(!isBot(id))S.ch[id].en=Math.min(100,S.ch[id].en+30);});}
  else if(s.sp==='turkey')S.res.meds+=2;
  return out;
}
function bobAuto(){var c=S.ch.bob;return c&&c.alive&&!c.off&&prog('bob').lv>=5;}
function adaOn(){return !!(S&&S.ada&&S.ada.on);}
/* who picks ripe mushrooms without you: Ada, an autonomous Bob, or (while you play) anyone on the Mushrooms job */
function keeper(online){if(adaOn())return 'Ada';if(bobAuto())return 'Bob';
  if(online){var k=null;IDS.forEach(function(id){var c=S.ch[id];if(!k&&c.alive&&!c.away&&!c.out&&taskKey(c.task)==='mist')k=CH[id].name;});return k;}return null;}
/* walk every bed forward to 'now': harvest and replant as the keeper would have, spoil what nobody picked */
function shroomRun(now,online,rep){
  if(!S.shroom)S.shroom=[];var kp=keeper(online),n=bayN();
  for(var i=0;i<n;i++){var s=S.shroom[i],guard=0;
    while(s&&kp&&s.ripe<=now&&guard++<300){var sp=s.sp,at=s.ripe,nm=harvestSlot(i,kp==='Bob'?'bob':null);if(rep)rep.h[nm]=(rep.h[nm]||0)+1;
      if(!plantSlot(i,sp,at)){if(rep)rep.nomat=true;break;}s=S.shroom[i];}
    s=S.shroom[i];if(s&&!s.bad&&now>=s.spoil){s.bad=true;if(rep)rep.spoil[SHROOM[s.sp].n]=(rep.spoil[SHROOM[s.sp].n]||0)+1;
      else if(online&&!shelterQuiet){jobLog(SHROOM[s.sp].n+' spoiled in the Mushroom Bay.','#ff9d92');}}
    if(s&&online&&!s.told&&slotState(s,now)==='ripe'){s.told=1;if(!shelterQuiet)toast(SHROOM[s.sp].n+' is ready to harvest in the Mushroom Bay.','#fde68a');}}
}

/* ---------- Ada ---------- */
var EPICS=[
  {n:'Core Cradle',d:'Clear the old server vault, pour a floor and run the 48V bus into it.',cost:{scrap:12,parts:6,copper:4},w:600},
  {n:'Tube Logic Racks',d:'Four hundred vacuum tubes in hand-wired racks.',cost:{parts:10,pcb:6,copper:6},w:1200},
  {n:'Core Memory',d:'Thread magnetic core memory planes, one ferrite ring at a time.',cost:{pcb:10,copper:10,gold:1},w:1800},
  {n:'Nervous System',d:'Sensors and relays into every room of the shelter.',cost:{copper:12,parts:8,pcb:4},w:1800},
  {n:'Awakening',d:'Feed her everything you have learned, then power her up.',cost:{intel:3,power:6},w:600}];
function adaWork(id,pts){var a=S.ada;if(a.on||!a.paid)return;a.w+=pts;var E=EPICS[a.ep];
  if(a.w>=E.w){a.w=0;a.paid=false;a.ep++;gainXP(id&&!isBot(id)?id:'sam',40,false);
    if(a.ep>=EPICS.length){a.on=true;jobLog('Ada is awake. She speaks softly through every speaker in the shelter.','#fbbf24');if(!shelterQuiet){toast('Ada is awake.','#fbbf24');try{sfx.revive();}catch(e){}}}
    else jobLog('Ada: stage '+a.ep+' of 5 complete ('+E.n+').','#fbbf24');
    IDS.forEach(function(i){if(taskKey(S.ch[i].task)==='proj'){S.ch[i].task='rest';S.ch[i].prog=0;}});}}
function adaPct(){var a=S.ada,t=0,d=0;EPICS.forEach(function(E,i){t+=E.w;if(i<a.ep)d+=E.w;else if(i===a.ep)d+=a.w;});return a.on?1:d/t;}

/* ---------- state, tick hooks ---------- */
function ensureNew(){widenQuarters();S.shroom=S.shroom||[];S.ada=S.ada||{ep:0,paid:false,w:0,on:false};S.adaAcc=S.adaAcc||{};if(!S.seen)S.seen=Date.now();}
function newSysTick(dt){
  if(!S.ada)ensureNew();
  shroomRun(Date.now(),true,null);
  if(adaOn())['tend','water','gen'].forEach(function(k){if(!getRoom(JROOM[k]))return;
    if(IDS.some(function(id){var c=S.ch[id];return c.alive&&!c.away&&!c.out&&taskKey(c.task)===k;}))return;
    S.adaAcc[k]=(S.adaAcc[k]||0)+dt*.5*roomMul(JROOM[k]);if(S.adaAcc[k]>=JT[k]){S.adaAcc[k]-=JT[k];S.res[JRES[k]]++;}});
}

/* ---------- catching up after the game was closed ---------- */
function awayRun(ms){
  ensureNew();var now=Date.now(),rep={h:{},spoil:{},got:{},made:[],nomat:false,ms:ms};
  var hrs=ms/3600000,cap=adaOn()?ADA_CAP:AWAY_CAP,h=Math.min(hrs,cap),ada0=S.ada.ep,adaP0=adaPct();
  function add(r,n){n=Math.floor(n+1e-9);if(n<=0)return 0;S.res[r]=(S.res[r]||0)+n;rep.got[r]=(rep.got[r]||0)+n;return n;}
  shelterQuiet=true;
  if(h>=.02)IDS.forEach(function(id){var c=S.ch[id];if(!c.alive||c.away||c.out)return;if(isBot(id)&&c.off)return;
    var k=taskKey(c.task),hum=!isBot(id),mul=roomMul(JROOM[k])*skill(id,k);
    if(k==='rest'){if(hum){c.en=100;c.hp=Math.min(100,c.hp+12*h);c.rad=Math.max(0,c.rad-6*h);}else c.hp=Math.min(100,c.hp+20*h);return;}
    if(hum)c.en=Math.max(30,c.en-4*h);
    if(OFFR[k]){var n=OFFR[k]*h*mul;if(k==='smelt')n=Math.min(n,Math.floor(S.res.scrap/2));if(k==='smelt')S.res.scrap-=2*Math.floor(n);if(add(JRES[k],n)&&hum)gainXP(id,Math.round(4*h),false);}
    else if(k==='craft'){var key=c.task.slice(6),r=RECIPES[key];if(!r)return;var cnt=Math.floor(h*3*mul),done=0;
      for(var q=0;q<cnt;q++){if(r.bobup&&prog('bob').lv<5){prog('bob').lv++;RECIPES.bob_up.cost=bobCost();}if(r.give)give(r.give);if(r.up)S.up[r.up]++;if(r.bot)addBot(r.bot);done++;S.stats.crafted=(S.stats.crafted||0)+1;
        if(r.up||r.bot||r.bobup||!canAfford(r.cost)||recMaxed(r)){c.task='rest';c.prog=0;break;}for(var ck in r.cost)S.res[ck]-=r.cost[ck];}
      if(done){rep.made.push(CH[id].name+' built '+done+'× '+r.name);if(hum)gainXP(id,Math.min(60,done*10),false);}}
    else if(k==='proj')adaWork(id,h*3600*PROJ_OFF*mul);
    else if(k==='treat'){var mb=roomLvl('medbay')-1;if(c.task==='treat:rad')c.rad=Math.max(0,c.rad-40-10*mb);else c.hp=Math.min(100,c.hp+30+10*mb);c.task='rest';c.prog=0;}
  });
  if(adaOn()&&h>=.02)['tend','water','gen'].forEach(function(k){if(!getRoom(JROOM[k]))return;
    if(IDS.some(function(id){var c=S.ch[id];return c.alive&&!c.away&&!c.out&&taskKey(c.task)===k;}))return;add(JRES[k],OFFR[k]*.5*h*roomMul(JROOM[k]));});
  shroomRun(now,false,rep);
  shelterQuiet=false;
  rep.capped=hrs>cap;rep.cap=cap;rep.adaFrom=adaP0;rep.adaTo=adaPct();rep.adaStage=S.ada.ep-ada0;
  S.seen=now;return rep;
}
function awayHTML(rep){
  var L=[],g=rep.got,ks=Object.keys(g);
  if(ks.length)L.push('<b>Gathered:</b> '+ks.map(function(k){return '+'+g[k]+' '+RNAME[k].toLowerCase();}).join(', ')+'.');
  rep.made.forEach(function(m){L.push(m+'.');});
  if(rep.adaTo>rep.adaFrom)L.push('<b>Ada:</b> '+Math.round(rep.adaFrom*100)+'% → '+Math.round(rep.adaTo*100)+'%'+(rep.adaStage?' ('+rep.adaStage+' stage'+(rep.adaStage>1?'s':'')+' finished)':'')+'.');

function wxStep(n){
  var w=S.wx;
  for(var i=0;i<n;i++){
    w.pv=w.pv*.82+rnd(-1,1)*.045;
    w.p=clamp(w.p+w.pv+(.5-w.p)*.035,.08,.92);
    w.h=clamp(w.h+(.52-w.p)*.14+rnd(-.035,.05)-w.rain*.13,0,1);
    w.w=clamp(w.w*.8+Math.abs(w.pv)*3.2+rnd(0,.07),0,1);
    w.rain=clamp((w.h-.66)/.26,0,1)*clamp((.6-w.p)/.3+.4,0,1);
    w.cloud=clamp(w.h*1.15+(.5-w.p)*.6,0,1);
    w.storm=(w.rain>.5&&w.w>.38)?(w.rain+w.w)/2:0;
    w.fog=clamp((w.h-.5)*2.4*(1-w.w*1.6),0,1)*(w.rain<.25?1:.35);
    w.contam=clamp(w.contam*.992+(Math.random()<.04?rnd(.1,.3):0),0,1);

    if(inb(tx,ty)&&blk(tx,ty)){if(Math.floor(g.y/TS)<ty){ny=ty*TS-1.5;if(Math.abs(g.vy)<120){g.rest=true;g.vy=0;g.vx=0;g.vr=0;g.r=Math.round(g.r/Math.PI)*Math.PI+(Math.random()-.5)*.5;X.stain.push({x:nx,y:ty*TS,w:4+Math.random()*4,k:0});}
      else{g.vy*=-.32;g.vx*=.55;g.vr*=.5;}}else{g.vx*=-.4;nx=g.x;}}
    g.x=nx;g.y=ny;g.r+=g.vr*dt;g.bl-=dt;if(g.bl<=0&&g.t<1.2&&QL>=1){g.bl=.06;X.bp.push({x:g.x,y:g.y,vx:g.vx*.3,vy:g.vy*.3-20,r:1+Math.random(),t:0});}});}
/* how a kill (or a heavy hit) tears an enemy apart, by weapon */
var GORE={Shotgun:.85,Rifle:.55,Pistol:.25,Knife:.3,bite:.2,takedown:.3};
function gore(e,wn,amt,dead){
  e.lost=e.lost||{};var dir=X.atk?(e.x>=X.atk.x?1:-1):(Math.random()<.5?1:-1),pc=GORE[wn]||.2;
  if(!dead){if((wn==='Shotgun'||wn==='Rifle')&&amt>=e.mhp*.4&&!e.lost.arm&&e.type!=='hound'&&Math.random()<.18){e.lost.arm=true;gib(e,'arm',4,30,.9,dir);bleed(e.x,e.y,24,dir,1);flt(e.x,e.y-.6,'ARM OFF','#ff8a7d');}return;}
  if(Math.random()>pc)return;
  var heavy=wn==='Shotgun'||(wn==='Rifle'&&Math.random()<.5),parts=[];
  if(e.type==='hound'){parts=['head','leg'];}
  else{if(heavy&&Math.random()<.55)parts.push('head');if(!e.lost.arm&&Math.random()<.7)parts.push('arm');if(heavy&&Math.random()<.4)parts.push('leg');if(!parts.length)parts.push(wn==='Knife'||wn==='bite'?'arm':'head');}
  parts.forEach(function(k){e.lost[k]=true;gib(e,k,k==='leg'?2:k==='arm'?4:1,k==='head'?42:k==='arm'?30:10,heavy?1.2:.8,dir);});
  for(var i=0;i<(heavy?6:3);i++)gib(e,'chunk',(Math.random()-.5)*10,15+Math.random()*25,heavy?1.1:.7,dir);
  bleed(e.x,e.y,heavy?60:40,dir,1.4);
}
function bloodStep(dt){
  var bp=X.bp,i,p,tx,ty;
  for(i=bp.length-1;i>=0;i--){p=bp[i];p.t+=dt;var ox=p.x,oy=p.y;p.vy+=780*dt;p.vx*=(1-1.4*dt);p.x+=p.vx*dt;p.y+=p.vy*dt;
    tx=Math.floor(p.x/TS);ty=Math.floor(p.y/TS);
    if(p.t>3||!inb(tx,ty)){bp.splice(i,1);continue;}
    if(blk(tx,ty)){var otx=Math.floor(ox/TS),oty=Math.floor(oy/TS);
      if(oty<ty&&!blk(tx,oty)){X.stain.push({x:p.x,y:ty*TS,w:p.r*(1.6+Math.random()*2.6),k:0});}          /* floor */
      else if(otx!==tx){X.stain.push({x:p.vx>0?tx*TS:(tx+1)*TS,y:oy,w:p.r*(.9+Math.random()),k:p.vx>0?1:2,l:5+Math.random()*16});}  /* wall, with a run */
      else{X.stain.push({x:p.x,y:(ty+1)*TS,w:p.r*1.4,k:3});}                                                /* ceiling */
      bp.splice(i,1);}
  }
  if(X.stain.length>320)X.stain.splice(0,X.stain.length-320);
}
function hurtEnemy(e,amt,wname,silent){
  var et=ET[e.type];amt=Math.max(1,Math.round(amt-(et.arm||0)));e.hp-=amt;e.flash=.25;flt(e.x,e.y,'-'+amt,'#ffd36b');sfx.hit();
  var nu=null,nd=99;X.units.forEach(function(u){if(u.dead||u.out)return;var d2=dd(u,e);if(d2<nd){nd=d2;nu=u;}});var bdir=nu?(e.x>=nu.x?1:-1):(Math.random()<.5?1:-1);
  bleed(e.x,e.y,e.hp<=0?34:7+Math.min(10,amt),bdir,e.hp<=0?1.25:.8);
  gore(e,wname,amt,e.hp<=0);
  if(e.type==='hound'||e.type==='raider'&&Math.random()<.3)sfx.growl();
  if(e.hp<=0){e.hp=0;S.stats.kills++;if(X.atk&&!X.atk.dead&&!X.atk.bot){prog(X.atk.id).kills++;gainXP(X.atk.id,8,true);}if(e.grab){e.grab.pin=null;e.grab=null;}e.dyingT=1;
    if(Math.random()<.45&&!contAt(e.x,e.y))X.cont.push({x:e.x,y:e.y,type:'body',done:false});
    X.units.forEach(function(u){if(u.pin===e)u.pin=null;});if(!X.en.some(function(q){return q.hp>0;}))toast('Area clear.','#4ade80');calcVis();}
  else if(e.st!=='hunt'){e.st='hunt';e.mem=6;}
  X.dirty=true;
}

/* ---------------- combat ---------------- */
function curWpn(u){return WPN[u.wpn];}
/* out of bullets: take the next weapon that can still fire, or the blade. Bullets found: go back. */
function autoWeapon(u){
  var w=WPN[u.wpn];if(!w)return;
  if(!w.melee&&X.ammo<w.ammo){var nx=null;u.wl.forEach(function(k){var q=WPN[k];if(!nx&&!q.melee&&q.ammo<=X.ammo)nx=k;});
    if(!nx)u.wl.forEach(function(k){if(!nx&&WPN[k].melee)nx=k;});
    if(nx&&nx!==u.wpn){if(!u.pref)u.pref=u.wpn;u.wpn=nx;u.cd=Math.max(u.cd,.35);toast(CH[u.id].name+' is out of ammo: '+WPN[nx].name.toLowerCase()+'.','#ffd9a0');}}
  else if(u.pref&&u.pref!==u.wpn&&WPN[u.pref]&&X.ammo>=WPN[u.pref].ammo){u.wpn=u.pref;u.pref=null;toast(CH[u.id].name+': back to the '+WPN[u.wpn].name.toLowerCase()+'.','#a5f3a5');}
}
function wDmg(u,w,d,tgt){
  var r=w.dmg,b;if(u.wpn==='shotgun')r=d<=2?[10,14]:d<=4?[6,9]:[2,4];b=ri(r[0],r[1]);
  if(tgt.pin)b=Math.round(b*1.5);b*=1+.07*at(u.id,'cmb');if(perk(u.id,'cmb',3)&&Math.random()<.15){b*=2;flt(tgt.x,tgt.y-.5,'CRIT','#fde68a');}return Math.round(b);}
function hitChance(u,e,w){
  var d=dd(u,e),c=w.acc;if(!w.melee&&d>w.rng*.5)c-=(d-w.rng*.5)*5;if(!w.melee&&coverFor(u,e))c-=22;if(e.pin)c+=25;if(e.st==='idle'||e.st==='inv')c+=15;return clamp(Math.round(c),8,96);}
function rollLoot(type,id){
  var r=Math.random(),o=[];
  if(type==='crate'){if(r<.5)o.push({res:'scrap',qty:ri(1,3)});else if(r<.72)o.push({res:'copper',qty:ri(1,2)});else if(r<.85)o.push({res:'ammo',qty:ri(3,6)});else if(r<.95)o.push({res:'parts',qty:1});else o.push({res:'armor',qty:1});}
  else if(type==='cabinet'){if(r<.3)o.push({res:'food',qty:ri(1,2)});else if(r<.58)o.push({res:'water',qty:ri(1,2)});else if(r<.78)o.push({res:'meds',qty:1});else if(r<.92)o.push({res:'antirad',qty:1});else o.push({res:'ammo',qty:ri(3,5)});}
  else if(type==='rack'){o.push({res:'pcb',qty:ri(1,2)+(id==='sam'&&Math.random()<.7?1:0)});if(Math.random()<.5)o.push({res:'parts',qty:1});if(Math.random()<.35)o.push({res:'copper',qty:ri(1,2)});if(Math.random()<(id==='sam'?.28:.14))o.push({res:'gold',qty:1});}
  else if(type==='vault'){o.push({res:'power',qty:ri(1,2)});if(Math.random()<.3)o.push({res:'parts',qty:1});if(Math.random()<.12)o.push({res:'gold',qty:1});}
  else if(type==='locker'){if(r<.35)o.push({res:'meds',qty:1});else if(r<.55)o.push({res:'antirad',qty:1});else if(r<.78)o.push({res:'armor',qty:1});else o.push({res:'ammo',qty:ri(4,8)});}
  else if(type==='body'){if(r<.5)o.push({res:'ammo',qty:ri(2,5)});else if(r<.7)o.push({res:'meds',qty:1});else if(r<.85)o.push({res:'scrap',qty:ri(1,2)});else o.push({res:'copper',qty:1});}
  else if(type==='case'){o.push({res:'weapon',qty:1});o.push({res:'ammo',qty:ri(5,9)});}
  else o.push({res:'scrap',qty:1});
  return o;
}
function weaponFound(u){
  if(!S.gear.rifleSam&&X.units.some(function(q){return q.id==='sam';})){S.gear.rifleSam=true;var s=unit('sam');if(s&&s.wl.indexOf('rifle')<0)s.wl.push('rifle');toast('Found a hunting rifle. Sam can use it.','#fdba74');}

var PSTACK=99;
function packAdd(u,res,qty){var i,room;for(i=0;i<u.pack.length&&qty>0;i++)if(u.pack[i].res===res&&u.pack[i].qty<PSTACK){room=Math.min(qty,PSTACK-u.pack[i].qty);u.pack[i].qty+=room;qty-=room;}
  while(qty>0&&u.pack.length<u.cap){room=Math.min(qty,PSTACK);u.pack.push({res:res,qty:room});qty-=room;}return qty;}
function addLoot(item,u){var left=item.qty,order=X.units.filter(function(q){return !q.dead&&!q.out&&q.cap>0;}).sort(function(a,b){return (a===u?-1:b===u?1:0)||dd(a,u||a)-dd(b,u||b);});
  for(var i=0;i<order.length&&left>0;i++)left=packAdd(order[i],item.res,left);return left;}
function packHolders(r,u){var own=[u].concat(X.units.filter(function(q){return q!==u&&!q.dead&&!q.out&&q.y===u.y&&Math.abs(q.x-u.x)<=2;}));return own.filter(function(q){return q.pack.some(function(p){return p.res===r;});});}
function packCount(r,u){var n=0;packHolders(r,u).forEach(function(q){q.pack.forEach(function(p){if(p.res===r)n+=p.qty;});});return n;}
function packTake(r,u){var h=packHolders(r,u)[0];if(!h)return false;for(var i=0;i<h.pack.length;i++)if(h.pack[i].res===r){h.pack[i].qty--;if(h.pack[i].qty<=0)h.pack.splice(i,1);return true;}return false;}
function packUsed(u){return u.pack.length;}

function inHome(u){return homeTile(u.x,u.y);}
function canReturn(){var l=live();return l.length>0&&l.every(inHome);}
function doReturn(){if(!X||X.over||!canReturn())return;sfx.door();endSortie('return');}
function cancelRecall(){if(!X||!X.recall)return;X.recall=false;live().forEach(function(u){u.path=null;u.after=null;u.hold=1;});toast('Recall cancelled. The squad holds here.','#ffd9a0');sfx.ui('tap');}
function recall(){
  if(!X||X.over)return;if(canReturn()){doReturn();return;}
  if(X.recall){cancelRecall();return;}
  X.recall=true;live().forEach(function(u){u.tgt=null;u.act=null;u.after=null;u.charge=false;u.path=u.pin?null:(bfsTo(u,homeTile,160,true)||[]);});
  toast(X.hatch.length?'Recall: everyone to the nearest way home.':'Recall: everyone to the door.','#a5b4fc');sfx.ui('ok');
}
function dmgUnit(u,amt,src,raw){
  var c=S.ch[u.id];if(u.dead)return;var env=src==='cold'||src==='fog'||src==='rad';amt=amt*(1-.05*at(u.id,'sur'))*(env&&perk(u.id,'sur',3)?.75:1);amt=Math.max(1,Math.round(amt));var absorbed=0;
  if(!raw&&c.ar>0){absorbed=Math.min(c.ar,amt);c.ar-=absorbed;amt-=absorbed;}
  if(absorbed)sfx.armorHit();
  if(amt>0){c.hp-=amt;sfx.hurt(u.id);u.flash=.25;X.shake=Math.max(X.shake,amt>8?7:4);
    if(u.act&&u.act.type!=='struggle'&&src!=='cold'&&src!=='rad'&&src!=='fog'){u.act=null;flt(u.x,u.y,'interrupted','#fbbf24');}}
  flt(u.x,u.y,(absorbed?'['+absorbed+'] ':'')+(amt>0?'-'+amt:''),amt>0?'#ff6a5a':'#7dd3fc');
  if(c.hp<=0&&perk(u.id,'sur',6)&&!u.wind){u.wind=true;c.hp=15;flt(u.x,u.y,'SECOND WIND','#fde68a');toast(CH[u.id].name+' refuses to go down.','#fde68a');}
  if(c.hp<=0){c.hp=0;u.dead=true;sfx.die();if(u.pin){u.pin.grab=null;u.pin=null;}toast(CH[u.id].name+' is down.','#ff8a7d');
    X.en.forEach(function(e){if(e.grab===u)e.grab=null;});
    if(u.id==='sam'){endSortie('dead');return;}calcVis();if(!live().length)endSortie('dead');}
}
function canShoot(u,e){var w=curWpn(u);if(!w||u.dead)return 'no weapon';
  if(w.melee){if(!near(u,e))return 'move adjacent';return null;}
  if(dd(u,e)>w.rng)return 'out of range';if(!los(u.x,u.y,e.x,e.y))return 'no line of sight';if(X.ammo<w.ammo)return 'no ammo';return null;}
function fireAt(u,e){
  var w=curWpn(u);u.dir=e.x>u.x?1:(e.x<u.x?-1:u.dir);var unaware=(e.st==='idle'||e.st==='inv');X.atk=u;
  u.ft=.15;u.cd=w.cd*(u.ow>0&&!w.melee?.55:1)*(S.ch[u.id].rad>=30?1.2:1);
  if(w.melee){
    if(u.wpn==='knife'&&unaware&&!e.pin&&e.type!=='brute'){sfx.knife();hurtEnemy(e,99,'knife');flt(e.x,e.y,'SILENT KILL','#a5f3a5');noise(u.x,u.y,1);}
    else{sfx.knife();if(Math.random()*100<hitChance(u,e,w)){hurtEnemy(e,wDmg(u,w,1,e)*(unaware?2:1),w.name);}else flt(e.x,e.y,'miss','#cbd5e1');noise(u.x,u.y,w.noise);}
    fxAdd({type:'slash',x:e.x,y:e.y});
  }else{
    if(!(perk(u.id,'cmb',6)&&Math.random()<.2)){X.ammo-=w.ammo;X.ammoUsed=(X.ammoUsed||0)+w.ammo;}sfx.shot(w.snd);u.flash=.15;X.shake=Math.max(X.shake,3);fxAdd({type:'tracer',x1:u.x,y1:u.y,x2:e.x,y2:e.y,t:0});fxAdd({type:'muzzle',x:u.x,y:u.y,dir:u.dir});
    var d=dd(u,e),hc=hitChance(u,e,w)+(u.ow>0?12:0);if(Math.random()*100<hc){hurtEnemy(e,wDmg(u,w,d,e)*(unaware?1.5:1),w.name);}else flt(e.x,e.y,'miss','#cbd5e1');
    noise(u.x,u.y,w.noise);
    X.en.forEach(function(q){if(q.hp>0&&q!==e&&Math.hypot(q.x-u.x,q.y-u.y)<=w.noise*.7&&q.st!=='hunt'){q.st='inv';q.tx=u.x;q.ty=u.y;q.mem=6;}});
  }
}
function doSearch(u,c){
  if(c.type==='vault'&&!c.shocked&&u.id!=='sam'&&Math.random()<.9){c.shocked=true;dmgUnit(u,14,'shock',true);sfx.zap();toast('SHOCK! Live battery vault.','#ff8a7d');}
  else if(c.type==='vault'&&u.id==='sam'&&!c.probed){c.probed=true;toast('Probe: vault is safe.','#4ade80');}
  sfx.search();noise(u.x,u.y,2);if(!u.bot)gainXP(u.id,5,true);c.done=true;if(!c.opened)c.oAt=X.t;c.opened=true;
  var items=c.left||rollLoot(c.type,u.id),got=[],left=[];c.left=null;
  items.forEach(function(it){
    if(it.res==='weapon'){weaponFound(u);got.push('weapon');return;}
    if(it.res==='ammo'){X.ammo+=it.qty;got.push('ammo');flt(c.x,c.y,'+'+it.qty+' ammo','#fdba74');sfx.pickup('ammo');return;}
    var rem=addLoot(it,u),ok=it.qty-rem;
    if(ok>0){got.push(it.res);flt(c.x,c.y,'+'+ok+' '+RNAME[it.res],RCOL[it.res]);sfx.pickup(it.res);}
    if(rem>0)left.push({res:it.res,qty:rem});
  });
  if(left.length){c.left=left;c.done=false;toast('Backpacks full. '+left.map(function(l){return l.qty+' '+RNAME[l.res];}).join(', ')+' left in the '+c.type+'.','#ff8a7d');}
  else if(!got.length)flt(c.x,c.y,'empty','#cbd5e1');
}

    X.kits.node--;S.story.nodes++;o.done=true;gainXP(u.id,30,true);S.res.intel++;sfx.node();flt(o.x,o.y,'NODE RESTORED','#f0abfc');toast('Node '+S.story.nodes+'/3 restored.'+(S.story.nodes>=3?' The AI is waking up.':''),'#f0abfc');if(S.story.nodes>=3)S.story.ai=true;}
  else if(t==='archive'){o.done=true;gainXP(u.id,30,true);S.res.intel+=2;addLoot({res:'antirad',qty:1},u);addLoot({res:'meds',qty:1},u);X.ammo+=6;sfx.search();sfx.relay();flt(o.x,o.y,'+2 INTEL','#c4b5fd');toast('Archive read: +2 intel, anti-rad, meds, ammo.','#c4b5fd');}
  else if(t==='ali'){if(u.id!=='sam'){toast('This is for Sam to see.','#ffd36b');return;}o.done=true;gainXP(u.id,30,true);S.story.ali=true;sfx.relay();endSortie('ending');return;}
}
/* timed actions */
var ACT_T={search:1.3,obj:2,item:.7,struggle:1.2};
function beginAct(u,type,extra){
  if(u.dead||u.act)return false;var a={type:type,t:0,dur:ACT_T[type]*(u.id==='sam'&&type==='search'?.8:1)*(type==='search'?Math.max(.45,1-.08*at(u.id,'sct')):1)};if(extra)for(var k in extra)a[k]=extra[k];
  if(type==='obj'&&X.obj){var tp=X.obj.type;a.dur=tp==='archive'?4.5:tp==='ali'?2.5:4;}
  u.act=a;u.path=null;u.tgt=null;if(type==='search'){sfx.search();noise(u.x,u.y,1);}else if(type==='obj')sfx.search();return true;
}
function finishAct(u){
  var a=u.act;u.act=null;if(!a)return;
  if(a.type==='search'){if(a.c&&!a.c.done&&near(u,a.c))doSearch(u,a.c);}
  else if(a.type==='obj')doObj(u);
  else if(a.type==='struggle'){if(Math.random()<.6){if(u.pin){u.pin.grab=null;u.pin=null;}flt(u.x,u.y,'free','#a5f3a5');sfx.ui('ok');}else{flt(u.x,u.y,'held','#ff6a5a');sfx.grunt(120);}}
  else if(a.type==='item'){var c=S.ch[u.id];
    if(a.kind==='treat'){if(packTake('treat',u)){c.hp=Math.min(100,c.hp+25);flt(u.x,u.y,'+25 HP','#fbbf24');sfx.treat();}}
    else if(a.kind==='meds'){if(packTake('meds',u)){c.band=Date.now()+90000;c.hp=Math.min(100,c.hp+30);flt(u.x,u.y,'+30 HP','#86efac');sfx.heal();}}
    else if(packTake('antirad',u)){c.rad=Math.max(0,c.rad-40);flt(u.x,u.y,'-40 rad','#bef264');sfx.antirad();}}
}
function doItem(u,kind){
  if(u.act){toast('Busy','#ff9d92');return;}
  if(u.id==='max'&&kind==='meds'&&packCount('treat',u))kind='treat';
  if(!packCount(kind,u)){sfx.ui('err');toast(kind==='meds'?(u.id==='max'?'No treats or medicine in reach':'No medicine in the backpack'):'No anti-rad in the backpack','#ff9d92');return;}
  beginAct(u,'item',{kind:kind});
}
function doStruggle(u){if(!u.pin)return;u.act=null;beginAct(u,'struggle');}
function doSkill(u,tgt){

  X.fl.forEach(function(f){f.t-=dt;});X.fl=X.fl.filter(function(f){return f.t>0;});
  X.fx.forEach(function(f){f.t+=dt;});X.fx=X.fx.filter(function(f){return f.t<(f.type==='pulse'?.7:f.type==='ring'?1:f.type==='bolt'?.5:.25);});
  X.shake*=Math.pow(.02,dt);X.flash=Math.max(0,X.flash-dt*1.6);X.tapT-=dt;
  [].concat(X.units,X.en).forEach(function(o){var sp=Math.min(1,dt*12);o.fx+=(o.x-o.fx)*sp;o.fy+=(o.y-o.fy)*sp;if(o.flash>0)o.flash-=dt;if(o.ft>0)o.ft-=dt;if(o.at>0)o.at-=dt;if(o.dyingT>0)o.dyingT-=dt*.9;});
  bloodStep(dt);gibStep(dt);
  var fr=0;X.units.forEach(function(q){if(!q.dead&&!q.out&&q.x>fr)fr=q.x;});var gz=0;while(fr>X.genX-26&&X.genX<GW&&gz++<3)genChunk();
  var u0=selUnit();var tgX=u0?u0.fx*TS+TS/2-W/2:X.camT;if(!X.drag){X.camT=clamp(tgX,0,Math.max(0,X.genX*TS-W));var cyT=u0?clamp(LH*.56-(LH-GH*TS-2)-(u0.fy+.5)*TS,0,camYMax()):0;X.camY=(X.camY||0)+(cyT-(X.camY||0))*Math.min(1,dt*4);}else X.camY=clamp(X.camY||0,0,camYMax());X.camX+=(X.camT-X.camX)*Math.min(1,dt*5);
  if(X.paused){X.hudT-=dt;if(X.hudT<=0){X.hudT=.2;tacHudUpdate();}return;}
  var su=selUnit();X.inA+=(((su&&!su.dead&&X.room[idx(su.x,su.y)])?1:0)-X.inA)*Math.min(1,dt*4);
  X.t+=dt;if(X.dest){X.dest.t-=dt;if(X.dest.t<=0)X.dest=null;}if(X.scanT>0){X.scanT-=dt;if(X.scanT<=0){X.scan=null;calcVis();}}
  X.units.forEach(function(u){if(X&&!X.over)updUnit(u,dt);});if(!X||X.over)return;
  X.en.forEach(function(e){if(X&&!X.over)updEnemy(e,dt);});if(!X||X.over)return;
  X.tk-=dt;if(X.tk<=0){X.tk+=1;envTick();if(!X||X.over)return;}
  if(X.recall&&canReturn()){doReturn();return;}
  var s=selUnit();if(!s||s.dead||s.out){var l=live();if(l.length)X.sel=l[0].id;}
  var rate=.6;live().forEach(function(q){if(q.bot)return;var amb=(X.room[idx(q.x,q.y)]?0:S.wx.fall*2.2);var r=(X.rad[idx(q.x,q.y)]+amb)*(q.eq.radsuit?.5:1);rate=Math.max(rate,.6+r*3.2);});
  AUS.geiger=Math.min(rate,70);AUS.dose=rate;
  var hu=live().some(function(q){return !q.bot&&S.ch[q.id].hp<25;});X.hb=(X.hb||0)-dt;if(hu&&X.hb<=0){sfx.heartbeat();X.hb=1.5;}
  X.hudT-=dt;if(X.hudT<=0){X.hudT=.15;tacHudUpdate();}
}

(function(){var g=GR.getContext('2d'),im=g.createImageData(96,96),i,v;for(i=0;i<im.data.length;i+=4){v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}g.putImageData(im,0,0);})();
var GRADE={sub:'rgba(20,120,120,.10)',rail:'rgba(200,120,40,.10)',forest:'rgba(40,110,50,.12)',alpine:'rgba(80,120,210,.12)',rtc:'rgba(150,50,160,.10)',shelter:'rgba(255,150,60,.05)'};
function drawLamps(t){
  ctx.save();ctx.globalCompositeOperation='lighter';
  live().forEach(function(u){var px=u.fx*TS+TS/2,py=(u.fy+.45)*TS;glow(ctx,px+u.dir*16,py-16,70,'rgba(255,225,170,A)',.16+.03*Math.sin(t*9+u.fx));});
  glow(ctx,TS*1.8,(G+.4)*TS,90,'rgba(255,190,110,A)',.18);
  X.cont.forEach(function(c){if(!c.done&&X.vis[idx(c.x,c.y)]===2)glow(ctx,c.x*TS+TS/2,(c.y+.6)*TS,26,'rgba(255,230,160,A)',.12);});
  ctx.restore();
}
function postFX(t,biome){
  var i,gr=GRADE[biome]||GRADE.shelter;
  /* light shafts */
  if(biome){var lx=X.camX*.4;ctx.save();ctx.globalCompositeOperation='lighter';for(i=0;i<4;i++){var sx=((i*190+60-lx)%(W+260)+W+260)%(W+260)-130,w2=34+hash(i)*30,al=.035*(.4+X.light)*(1-S.wx.cloud*.5);
    var g=ctx.createLinearGradient(sx,0,sx+80,LH*.8);g.addColorStop(0,'rgba(190,215,255,'+al+')');g.addColorStop(1,'rgba(190,215,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx+w2,0);ctx.lineTo(sx+w2+90,LH*.8);ctx.lineTo(sx+60,LH*.8);ctx.fill();}ctx.restore();}
  /* ground fog layers */
  if(biome){var oy=worldOY()+(G+1)*TS;for(i=0;i<2;i++){var off=(t*(6+i*5)+i*130)%W,fg=ctx.createLinearGradient(0,oy-46,0,oy+4);fg.addColorStop(0,'rgba(170,190,205,0)');fg.addColorStop(1,'rgba(170,190,205,'+(.07+S.wx.fog*.18)+')');ctx.fillStyle=fg;ctx.fillRect(0,oy-46,W,50);}}
  /* drifting dust */
  ctx.fillStyle='rgba(255,235,200,.22)';for(i=0;i<26;i++){var dx=((hash(i)*W+t*(4+hash(i+3)*10)+(X?X.camX*.2:0))%W+W)%W,dy=(hash(i+5)*LH+Math.sin(t*.7+i)*8)%LH;ctx.fillRect(dx,dy,1.4,1.4);}
  /* colour grade */
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,LH);
  /* vignette */
  var vg=ctx.createRadialGradient(W/2,LH/2,LH*.35,W/2,LH/2,Math.max(W,LH)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,LH);
  /* film grain */
  ctx.save();ctx.globalAlpha=.045;ctx.globalCompositeOperation='overlay';var gx=Math.floor(Math.random()*96),gy=Math.floor(Math.random()*96);
  for(var yy=-gy;yy<LH;yy+=96)for(var xx=-gx;xx<W;xx+=96)ctx.drawImage(GR,xx,yy);ctx.restore();
}
function drawRipples(t){
  if(S.wx.rain<.1)return;var oy=worldOY()+(G+1)*TS-3,n=Math.round(S.wx.rain*14);ctx.strokeStyle='rgba(200,220,240,.35)';ctx.lineWidth=1;
  for(var i=0;i<n;i++){var ph=(t*1.6+hash(i)*5)%1,rx=hash(i+4)*W;ctx.globalAlpha=1-ph;ctx.beginPath();ctx.ellipse(rx,oy+hash(i+8)*6,3+ph*9,1+ph*2.5,0,0,6.2832);ctx.stroke();}ctx.globalAlpha=1;
}
function drawWeatherFX(t){ctx.save();ctx.globalAlpha=1-X.inA*.92;drawWeatherFX2(t);ctx.restore();}
function drawWeatherFX2(t){drawRipples(t);
  var w=S.wx,b=X.biome,i,n,WXA=1-X.inA*.94;
  /* falling ash, everywhere, always */
  for(i=0;i<38;i++){var ax=((hash(i+40)*W*1.3+t*(6+w.w*40)*(.5+hash(i+41))+Math.sin(t*.8+i)*14)%(W*1.3))-20,ay=(hash(i+42)*LH+t*(9+hash(i+43)*14))%LH,as=1.2+hash(i+44)*2;ctx.fillStyle='rgba(205,200,190,'+(.18+hash(i+45)*.3)+')';ctx.fillRect(ax,ay,as,as*.8);}
  if(w.fog>.05){ctx.fillStyle='rgba(185,198,208,'+(w.fog*.3*WXA)+')';ctx.fillRect(0,0,W,LH);}
  if(b==='alpine'){ctx.fillStyle='rgba(255,255,255,.7)';for(i=0;i<70;i++){var sx=((hash(i)*W*1.4+t*(25+w.w*120)*hash(i+1)*2)%(W*1.4))-30,sy=(hash(i+9)*LH+t*(30+hash(i)*30))%LH;ctx.fillRect(sx,sy,1.6+hash(i+2)*1.4,1.6);}}
  else if(b==='forest'){for(i=0;i<22;i++){var fx=(hash(i)*W+Math.sin(t*.6+i)*20),fy=((hash(i+9)*LH-t*6*(1+hash(i)))%LH+LH)%LH,fa=.4+.4*Math.sin(t*2+i);glow(ctx,fx,fy,7,'rgba(210,255,120,A)',fa*.7);}}
  else if(b==='rail'){ctx.fillStyle='rgba(255,210,170,.18)';for(i=0;i<40;i++){var dx=((hash(i)*W*1.3+t*(60+w.w*200)*hash(i+2))%(W*1.3))-20,dy=hash(i+9)*LH;ctx.fillRect(dx,dy,5+w.w*14,1);}}
  else if(b==='sub'){for(i=0;i<16;i++){var gx=(hash(i)*W+Math.sin(t*.5+i)*12),gy=((hash(i+9)*LH-t*10*(.5+hash(i)))%LH+LH)%LH;glow(ctx,gx,gy,10,'rgba(130,255,190,A)',.07);}}
  if(w.rain>.03){ctx.strokeStyle=w.fall>.25?'rgba(200,240,140,'+((.25+w.rain*.3)*WXA)+')':'rgba(180,205,235,'+((.25+w.rain*.35)*WXA)+')';ctx.lineWidth=1;ctx.beginPath();n=Math.round(40+w.rain*220);var sl=2+w.w*12;
    for(i=0;i<n;i++){var rx=((hash(i)*W*1.4+t*w.w*140)%(W*1.4))-20,ry=(hash(i+11)*LH+t*(520+hash(i)*160))%LH;ctx.moveTo(rx,ry);ctx.lineTo(rx-sl,ry+11);}ctx.stroke();}
}
function drawDark(t){
  var w=S.wx,a=clamp(.7*(1-X.light)+.08+w.cloud*.12+w.storm*.1,.08,.94),R=visR()*TS,oy=worldOY(),cam=Math.round(X.camX);
  dkc.save();dkc.setTransform(1,0,0,1,0,0);dkc.globalCompositeOperation='source-over';dkc.clearRect(0,0,dk.width,dk.height);dkc.restore();
  dkc.fillStyle='rgba(4,8,18,'+a+')';dkc.fillRect(0,0,W,LH);dkc.globalCompositeOperation='destination-out';
  function hole(px,py,r,s){var g=dkc.createRadialGradient(px,py,r*.1,px,py,r);g.addColorStop(0,'rgba(0,0,0,'+s+')');g.addColorStop(.6,'rgba(0,0,0,'+s*.6+')');g.addColorStop(1,'rgba(0,0,0,0)');dkc.fillStyle=g;dkc.beginPath();dkc.arc(px,py,r,0,6.2832);dkc.fill();}
  live().forEach(function(u){hole(u.fx*TS+TS/2-cam,(u.fy+.5)*TS+oy,R*(.9+.2*X.light)*(u.sneak?.9:1),.95);});
  X.fx.forEach(function(f){if(f.type==='muzzle')hole(f.x*TS+TS/2-cam,(f.y+.5)*TS+oy,120,.9);});
  if(X.obj&&X.vis[idx(X.obj.x,X.obj.y)])hole(X.obj.x*TS+TS/2-cam,(X.obj.y+.5)*TS+oy,80,.7);
  /* hatch light */
  hole(TS*1.8-cam,(G+.4)*TS+oy,110,.5);
  dkc.globalCompositeOperation='source-over';ctx.drawImage(dk,0,0,W,LH);
}
function drawExp(t){
  var sh=X.shake>.3?[rnd(-X.shake,X.shake),rnd(-X.shake,X.shake)]:[0,0],oy=worldOY();
  ctx.save();ctx.fillStyle='#05070a';ctx.fillRect(0,0,W,LH);ctx.translate(sh[0],sh[1]);
  drawBackdrop(t);
  ctx.save();ctx.translate(-Math.round(X.camX),oy);
  drawTiles(t);drawGrowth(t);drawStains();drawGibs();drawRange(t);drawCont(t);drawEnts(t);drawFx(t);drawLamps(t);
  ctx.restore();
  drawDark(t);drawWeatherFX(t);postFX(t,X.biome);
  if(X.flash>0){ctx.fillStyle='rgba(235,240,255,'+X.flash+')';ctx.fillRect(0,0,W,LH);}
  if(AUS.dose>4){var va=clamp((AUS.dose-4)/30,0,.4);var g=ctx.createRadialGradient(W/2,LH/2,LH*.3,W/2,LH/2,LH*.75);g.addColorStop(0,'rgba(163,230,53,0)');g.addColorStop(1,'rgba(163,230,53,'+va+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,LH);}
  if(X.t>X.max){ctx.fillStyle='rgba(255,120,60,'+(.07+.04*Math.sin(t*3))+')';ctx.fillRect(0,0,W,LH);}
  /* off-screen unit markers */
  X.units.forEach(function(u){if(u.dead||u.out)return;var sx=u.fx*TS+TS/2-X.camX;if(sx<8||sx>W-8){ctx.fillStyle=CH[u.id].col;ctx.beginPath();var ex=sx<8?10:W-10,d=sx<8?-1:1;ctx.moveTo(ex+d*6,oy+(u.fy+.5)*TS);ctx.lineTo(ex-d*4,oy+(u.fy+.5)*TS-8);ctx.lineTo(ex-d*4,oy+(u.fy+.5)*TS+8);ctx.fill();}});
  ctx.restore();
}

    if(B.sn)setBtn(B.sn,{ic:'eye',l:u.sneak?'Sneaking':'Sneak',s:u.sneak?'slow, quiet':'fast, loud',on:u.sneak});

/* close-up portrait of the selected character */
var FACES={},faceId=null,faceHp=-1;

  var pc=document.createElement('canvas');pc.width=pc.height=256;var o=ctx,c2=pc.getContext('2d'),col=CH[id].col;
  var g=c2.createRadialGradient(128,110,20,128,128,190);g.addColorStop(0,'#3a4250');g.addColorStop(1,'#0b0f14');c2.fillStyle=g;c2.fillRect(0,0,256,256);
  c2.globalAlpha=.16;c2.fillStyle=col;c2.fillRect(0,0,256,256);c2.globalAlpha=1;
  ctx=c2;try{var bt=CH[id].bot;
    if(id==='max')dog(128-18*9,128+25*9,1,.4,0,9,false);
    else if(bt==='worker')robot(128,128+37*9,1,.4,0,9,false,false,id==='bob'?'#ff9d3a':'#5eead4');
    else human(id,128-1.4*15,136+43.4*15,1,.4,0,15,false);
  }catch(e){}ctx=o;
  var v=c2.createRadialGradient(128,128,90,128,128,185);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');c2.fillStyle=v;c2.fillRect(0,0,256,256);
  return FACES[id]=pc.toDataURL('image/png');
}
function updateFace(){

/* ---- graphics level: 3 high, 2 balanced, 1 light, 0 minimal. 'auto' steps down when frames run slow ---- */
var QPX=[0.55e6,1.0e6,1.7e6,3.0e6],QNAME=['Minimal','Light','Balanced','High'],GFX='auto',QL=2,fEMA=8,iEMA=16.7,slowT=0,lastF=0;
try{var gs=localStorage.getItem('atlas_gfx');if(gs&&gs!=='auto'){GFX=gs;QL=clamp(+gs,0,3);}}catch(e){}
function setGfx(v){GFX=v;QL=v==='auto'?2:clamp(+v,0,3);fEMA=8;iEMA=16.7;slowT=0;try{localStorage.setItem('atlas_gfx',String(v));}catch(e){}layout();}
function gfxLabel(){return GFX==='auto'?'Auto ('+QNAME[QL]+')':QNAME[QL];}
/* glow shadows are among the costliest canvas operations: off below Balanced */
(function(){try{var pr=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'shadowBlur');if(pr&&pr.set)Object.defineProperty(ctx,'shadowBlur',{configurable:true,get:function(){return pr.get.call(this);},set:function(v){pr.set.call(this,QL>=3?v:0);}});}catch(e){}})();
/* film pass: soft bloom on bright areas plus fine grain, at device resolution */
var BL=document.createElement('canvas'),BLC=BL.getContext('2d'),GR=document.createElement('canvas'),GRP=null;
(function(){GR.width=GR.height=192;var g=GR.getContext('2d'),im=g.createImageData(192,192),d=im.data;for(var i=0;i<d.length;i+=4){var v=110+Math.random()*90;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}g.putImageData(im,0,0);})();
function hdPass(){
  var w=cv.width,h=cv.height;ctx.save();ctx.setTransform(1,0,0,1,0,0);
  /* ash-and-dust grade, done on the canvas itself */
  if(QL>=1){ctx.globalCompositeOperation='color';ctx.globalAlpha=.3;ctx.fillStyle='rgb(134,121,104)';ctx.fillRect(0,0,w,h);}
  else{ctx.globalAlpha=.1;ctx.fillStyle='rgb(134,121,104)';ctx.fillRect(0,0,w,h);}
  if(QL>=3){
    var bw=Math.max(8,Math.round(w/8)),bh=Math.max(8,Math.round(h/8));if(BL.width!==bw||BL.height!==bh){BL.width=bw;BL.height=bh;}
    BLC.globalCompositeOperation='source-over';BLC.imageSmoothingEnabled=true;BLC.drawImage(cv,0,0,bw,bh);
    BLC.globalCompositeOperation='multiply';BLC.drawImage(BL,0,0);BLC.drawImage(BL,0,0);
    ctx.imageSmoothingEnabled=true;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5;ctx.drawImage(BL,0,0,w,h);}
  if(QL>=3){if(!GRP)GRP=ctx.createPattern(GR,'repeat');
    ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.1;var ox=Math.floor(Math.random()*192),oy=Math.floor(Math.random()*192);ctx.translate(-ox,-oy);ctx.fillStyle=GRP;ctx.fillRect(0,0,w+192,h+192);}
  ctx.restore();
}

/* ====================================================================
   MAIN LOOP + BOOT
   ==================================================================== */
var last=performance.now(),TT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  /* never draw faster than 60 frames a second, whatever the display runs at */
  if(now-lastF<15)return;
  var gap=Math.min(100,now-(lastF||now));lastF=now;
  var dt=Math.min(0.05,(now-last)/1000);last=now;TT+=dt;var t0=performance.now();
  try{
    if(MODE==='exp'&&X&&!X.over){tacUpdate(dt);if(X&&!X.over)drawExp(TT);}
    else{if(MODE==='day')shelterRT(dt);drawDay(TT);postFX(TT,null);}
    hdPass();updateFace();
    auUpdate(dt);
  }catch(err){window.__err=String(err&&err.stack||err);console.error(err);}
  /* governor: if frames are slow for a few seconds, lower the level one step */
  fEMA+=(performance.now()-t0-fEMA)*.06;iEMA+=(gap-iEMA)*.06;
  if(GFX==='auto'&&QL>0){if(fEMA>13||iEMA>26){slowT+=dt;if(slowT>2.5){QL--;slowT=0;fEMA=8;iEMA=16.7;layout();}}else slowT=Math.max(0,slowT-dt*.5);}
}
